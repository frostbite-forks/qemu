name: Build qemu-system-ppc (macOS ARM64)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: qemu-system-ppc / macos-arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Homebrew dependencies
        run: |
          brew update --quiet
          brew install ninja pkg-config glib pixman python3 gettext

      - name: Stub missing Carbon tools (Rez / SetFile removed in Xcode 13+)
        run: |
          for tool in Rez SetFile; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/"$tool" > /dev/null
              sudo chmod +x /usr/local/bin/"$tool"
            fi
          done

      - name: Configure
        run: |
          ./configure \
            --target-list=ppc-softmmu \
            --disable-werror \
            --enable-cocoa \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --enable-virtfs \
            --audio-drv-list=coreaudio

      - name: Build
        run: ninja -C build -j$(sysctl -n hw.logicalcpu)

      - name: Smoke test
        run: build/qemu-system-ppc --version

      - name: Stage distribution layout
        run: |
          mkdir -p dist/bin dist/share/qemu
          cp build/qemu-system-ppc dist/bin/
          find pc-bios -maxdepth 1 -type f \( \
            -name '*.bin' -o -name '*.rom' -o -name '*.img' -o \
            -name '*.elf' -o -name '*.dtb' -o -name '*.fd'  -o \
            -name 'openbios-*' -o -name 'u-boot*' \
          \) -exec cp {} dist/share/qemu/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-ppc-macos-arm64
          path: dist/
          retention-days: 30
